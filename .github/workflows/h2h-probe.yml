name: H2H probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -c "
          import logging; logging.basicConfig(level=logging.INFO)
          from datetime import date
          from punt_lab.nba import espn, odds
          games = [g for g in espn.slate_games(date(2026, 11, 8)) if g.get('state') in (None, 'pre')]
          rows = odds.fetch_h2h(games)
          print(len(games), 'games,', len(rows), 'teams priced,', sum(1 for r in rows if r['lay']), 'with a Betfair lay price')
          for r in rows[:6]: print(r['game'], r['team'], r['best_back'], r['best_book'], 'lay', r['lay'], len(r['books']), 'books')
          "
