name: OddsPapi probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for NBA player props from AU bookies on OddsPapi
        env:
          KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, collections
          key = os.environ.get("KEY")
          base = "https://api.oddspapi.io/v4"
          def get(path, **params):
              params["apiKey"] = key
              url = f"{base}{path}?" + "&".join(f"{k}={v}" for k, v in params.items())
              try:
                  with urllib.request.urlopen(url, timeout=90) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, path, e.read()[:300]); return None
          mk = get("/markets") or []
          bb = {m["marketId"]: m for m in mk if m.get("sportId") == 11}
          props = [m for m in bb.values() if m.get("playerProp")]
          names = collections.Counter(m["marketName"] for m in props)
          print("basketball markets:", len(bb), "player-prop:", len(props))
          for n, c in names.most_common(40): print(f"  {c:4d}  {n}")
          ex = [m for m in props if "point" in m["marketName"].lower()][:3]
          print("examples:", json.dumps(ex)[:1200])
          od = get("/odds-by-tournaments", tournamentIds=132, bookmaker="neds.com.au", oddsFormat="decimal")
          fl = od if isinstance(od, list) else (od or {}).get("fixtures") or (od or {}).get("data") or []
          if isinstance(od, dict) and not fl: print("shape keys:", list(od)[:10])
          print("fixtures returned:", len(fl))
          for f in fl[:12]:
              bo = (f.get("bookmakerOdds") or {}).get("neds.com.au", {})
              ms = bo.get("markets", {})
              kinds = collections.Counter()
              for mid in ms:
                  d = bb.get(int(mid))
                  if d and d.get("playerProp"): kinds[d["marketName"]] += 1
              print(f'  {f.get("startTime")} {f.get("fixtureId")}  markets {len(ms):4d}  props {sum(kinds.values()):4d}  {dict(kinds.most_common(5))}')
          # one concrete sample: a player points prop with its line and price
          for f in fl:
              for mid, m in ((f.get("bookmakerOdds") or {}).get("neds.com.au", {}).get("markets") or {}).items():
                  d = bb.get(int(mid))
                  if d and d.get("playerProp") and "point" in d["marketName"].lower():
                      for oid, o in (m.get("outcomes") or {}).items():
                          for pid, pl in (o.get("players") or {}).items():
                              oname = next((x["outcomeName"] for x in d["outcomes"] if x["outcomeId"] == int(oid)), oid)
                              print("sample:", d["marketName"], "handicap", d.get("handicap"), oname, pl.get("playerName"), pl.get("price"), "mainLine", pl.get("mainLine"))
                              raise SystemExit
          PY
