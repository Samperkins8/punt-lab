name: OddsPapi probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for NBA player props from AU bookies on OddsPapi
        env:
          KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          key = os.environ.get("KEY")
          base = "https://api.oddspapi.io/v4"
          def get(path, **params):
              params["apiKey"] = key
              url = f"{base}{path}?" + "&".join(f"{k}={v}" for k, v in params.items())
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, path, e.read()[:300]); return None
          sports = get("/sports") or []
          bb = [s for s in sports if "basket" in json.dumps(s).lower()]
          print("basketball:", json.dumps(bb)[:300])
          sid = bb[0].get("sportId")
          tours = get("/tournaments", sportId=sid) or []
          nba = [t for t in tours if (t.get("tournamentName") or "").strip().upper() == "NBA"] or [t for t in tours if "nba" in json.dumps(t).lower()]
          print("nba:", json.dumps(nba[:3])[:500])
          tid = nba[0]["tournamentId"]
          now = datetime.now(timezone.utc)
          fx = get("/fixtures", tournamentId=tid, statusId=0, **{"from": now.strftime("%Y-%m-%dT%H:%M:%SZ"), "to": (now + timedelta(days=2)).strftime("%Y-%m-%dT%H:%M:%SZ")}) or []
          print("upcoming fixtures:", len(fx), [(f.get("participant2Name"), "@", f.get("participant1Name"), f.get("startTime"), f.get("hasOdds")) for f in fx[:4]])
          f = next((x for x in fx if x.get("hasOdds")), fx[0])
          od = get("/odds", fixtureId=f["fixtureId"], oddsFormat="decimal") or {}
          bo = od.get("bookmakerOdds", {})
          print("bookmakers with odds:", len(bo), sorted(bo))
          for b, v in sorted(bo.items()):
              mk = v.get("markets", {})
              prop_markets, names, sample = 0, set(), None
              for mid, m in mk.items():
                  has = False
                  for oid, o in (m.get("outcomes") or {}).items():
                      for pid, pl in (o.get("players") or {}).items():
                          if pl.get("playerName"):
                              has = True; names.add(pl["playerName"])
                              if sample is None: sample = (mid, oid, pid, pl)
                  prop_markets += has
              au = any(s in b for s in ("tab", "neds", "pointsbet", "unibet", "sportsbet", "ladbrokes", "betr", "-au"))
              if au or prop_markets:
                  print(f"{b:22s} markets {len(mk):4d}  player-prop markets {prop_markets:4d}  players {len(names):3d}  {'AU' if au else ''}")
                  if sample and au: print("      e.g.", json.dumps(sample)[:400])
          mkts = get("/markets", sportId=sid)
          if mkts:
              props = [m for m in mkts if any(w in json.dumps(m).lower() for w in ("player", "points", "rebounds"))][:12]
              print("market definitions sample:", json.dumps(props)[:1500])
          PY
