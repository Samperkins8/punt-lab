name: NBA daily multi

on:
  schedule:
    # GitHub schedules run in UTC. 20:44 UTC = 7:44am Melbourne in summer time (8:44am in winter).
    - cron: "44 20 * * *"   # morning build: grade yesterday, analyse today
    - cron: "38 22 * * *"   # pre-tip re-check (9:38am Melbourne summer time)
    - cron: "8,38 21-23,0-7 * * *"   # late checks every 30 min, ~8am-6:30pm Melbourne: each game once 15-75 min before tip, its line-ups once in the last 35, and each game graded once it's final
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, pretip or late"
        default: daily
      date:
        description: "slate date YYYY-MM-DD (Melbourne), blank for today"
        required: false

permissions:
  contents: write

concurrency:
  group: nba
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_DAILY_CREDITS: "14"   # props; + 2 for the promo page's head-to-head prices = 16 a day, inside the free 500 a month
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "38 22 * * *") MODE=pretip ;;
              "8,38 21-23,0-7 * * *") MODE=late ;;
              *) MODE=daily ;;
            esac
          fi
          ARGS="--mode $MODE"
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          python -m punt_lab.nba.build $ARGS
      - name: Publish
        run: |
          git config user.name "punt-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nba/data punt_lab/nba/cache
          git diff --cached --quiet || git commit -m "Update multis $(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
