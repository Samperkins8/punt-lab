name: NBA weekly tune

on:
  schedule:
    # 01:13 UTC Monday = 12:13pm Melbourne (summer time), after the morning's games are done
    - cron: "13 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest and tune
        run: python -m punt_lab.nba.backtest
      - name: Publish
        run: |
          git config user.name "punt-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add punt_lab/nba/tuned.json punt_lab/nba/versions.json punt_lab/nba/cache docs/nba/data/backtest.json
          git diff --cached --quiet || git commit -m "Weekly tune $(TZ=Australia/Melbourne date '+%Y-%m-%d')"
          git pull --rebase
          git push
