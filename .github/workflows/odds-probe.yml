name: Odds probe (AU props)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask The Odds API which AU bookies have NBA player props
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ["KEY"]
          base = "https://api.the-odds-api.com/v4/sports/basketball_nba"
          ev = json.load(urllib.request.urlopen(f"{base}/events?apiKey={key}"))
          ev = sorted(ev, key=lambda e: e["commence_time"])[0]
          print("event:", ev["away_team"], "@", ev["home_team"], ev["commence_time"])
          url = f"{base}/events/{ev['id']}/odds?apiKey={key}&regions=au&markets=player_points,player_points_alternate&oddsFormat=decimal"
          r = urllib.request.urlopen(url)
          data = json.load(r)
          print("credits left:", r.headers.get("x-requests-remaining"), "used:", r.headers.get("x-requests-last"))
          for b in data.get("bookmakers", []):
              for m in b.get("markets", []):
                  outs = m.get("outcomes", [])
                  print(f'{b["key"]:14s} {m["key"]:26s} {len(outs):4d} outcomes  e.g. {[(o.get("description"), o.get("name"), o.get("point"), o.get("price")) for o in outs[:3]]}')
          if not data.get("bookmakers"):
              print("no AU bookmakers returned player props")
          PY
