<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Punt Lab</title>
<style>
  @font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
  :root { --bg: #f5f2f9; --panel: #ffffff; --fg: #1b1030; --muted: #675c7a; --line: #e2d9ee; --good: #1f7a3d; --accent: #552583; --gold: #fdb927;
          --serif: "Barlow Condensed", "Arial Narrow", sans-serif; --sans: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #140b21; --panel: #21153a; --fg: #f4f0fa; --muted: #b5a8cc; --line: #3b2d57; --good: #6fd08f; --accent: #d3bdf2; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--sans); }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 16px; }
  h1 { font: 700 44px/0.95 var(--serif); margin: 0; }
  p { margin: 0; color: var(--muted); }
  a.card { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; color: inherit; text-decoration: none; }
  a.card strong { font: 700 24px/1.1 var(--serif); }
  .soon { opacity: .55; pointer-events: none; }
  .band { background: #552583; color: #fff; border-bottom: 4px solid var(--gold); }
  .band { position: relative; overflow: hidden; }
  .band div { position: relative; max-width: 720px; margin: 0 auto; padding: 22px 16px 18px; display: grid; gap: 6px; min-height: 230px; align-content: end; box-sizing: border-box; }
  .band .hero { position: absolute; right: max(0px, calc(50% - 360px)); bottom: 0; height: 100%; max-height: 300px; pointer-events: none; }
  .band h1, .band p { position: relative; max-width: 62%; text-shadow: 0 1px 6px rgba(20, 8, 40, .6); }
  .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #552583 30%, rgba(85, 37, 131, 0) 75%); pointer-events: none; }
  .band div { z-index: 1; } .band .hero { z-index: 0; }
  .band h1 { color: #fff; } .band p { color: #e6dcf5; }
  a.card strong { color: var(--accent); }
</style>
</head>
<body>
<header class="band"><img class="hero" src="hero.webp" alt=""><div><h1>Punt Lab</h1><p>Daily player-prop multis built from free data. Analysis, not a guarantee.</p></div></header>
<main>
  <a class="card" href="nba/"><strong>NBA</strong><span id="nba-line">Today's multis, every candidate leg and the track record</span></a>
  <a class="card" href="promo/"><strong>Promo calculator</strong><span>Lock in bonus bets by laying them on Betfair, for NBA or horses, plus today's best games to use one on</span></a>
  <a class="card soon" href="#"><strong>AFL</strong><span>Coming later</span></a>
</main>
<script>
  fetch('nba/data/report.json?t=' + Date.now()).then((r) => r.ok ? r.json() : null).then((rep) => {
    if (rep && rep.headline) document.getElementById('nba-line').textContent = rep.headline;
  }).catch(() => {});
</script>
</body>
</html>
